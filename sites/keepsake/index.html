<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Keepsake — 소중한 순간을 선택하는 사진 아카이브</title>
<meta name="description" content="Keepsake(킵세이크)는 수많은 사진 중 정말 간직하고 싶은 순간을 직접 고르고, 의미를 기록하고, 시간이 지난 뒤 다시 돌아볼 수 있게 돕는 개인 사진 아카이브 앱입니다." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://keepsake.atelierlabs.co.kr/" />
<link rel="alternate" hreflang="ko" href="https://keepsake.atelierlabs.co.kr/" />
<link rel="alternate" hreflang="en" href="https://keepsake.atelierlabs.co.kr/en/" />
<link rel="alternate" hreflang="ja" href="https://keepsake.atelierlabs.co.kr/ja/" />
<link rel="alternate" hreflang="x-default" href="https://keepsake.atelierlabs.co.kr/" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta property="og:title" content="Keepsake" />
<meta property="og:description" content="모든 순간을 저장하기보다, 소중한 순간을 선택한다." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://keepsake.atelierlabs.co.kr/" />
<meta property="og:image" content="https://keepsake.atelierlabs.co.kr/assets/icon.png" />
<style>
  :root { --paper: #FFFFFF; --surface: #FAF8F4; --ink: #151515; --muted: #5c5c5c; --line: rgba(21,21,21,.24); --coral: #B26634; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--surface); color: var(--ink);
    font-family: "Pretendard Variable", "SUIT", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7; letter-spacing: -0.025em;
  }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 720px; margin: 0 auto; padding: 80px 20px; }
  main img { width: 96px; height: 96px; border-radius: 24px; margin-bottom: 36px; }
  h1 { margin: 0 0 20px; font-size: clamp(44px, 9vw, 88px); line-height: .95; letter-spacing: -.07em; }
  h1::after { content: "."; color: var(--coral); }
  .lead { margin: 0 0 16px; font-size: clamp(18px, 2vw, 24px); font-weight: 700; }
  p { margin: 0 0 28px; color: #444; font-size: 16px; }
  .soon { display: inline-block; padding: 6px 14px; border: 1px solid var(--ink); border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  footer { border-top: 1px solid var(--line); padding: 24px 20px 36px; text-align: center; font-size: 13px; color: var(--muted); }
  footer a { color: var(--ink); text-decoration: none; }
  .lang-switch { position: absolute; top: 20px; right: 20px; font-size: 12.5px; font-weight: 700; }
  .lang-switch a, .lang-switch strong { padding: 3px 6px; color: var(--muted); text-decoration: none; }
  .lang-switch strong { color: var(--ink); }
  .lang-switch a:hover { color: var(--coral); }
</style>
</head>
<body>
  <div class="lang-switch"><strong>KO</strong><a href="/en/" hreflang="en">EN</a><a href="/ja/" hreflang="ja">JA</a></div>
  <main>
    <img src="/assets/icon.png" alt="Keepsake" />
    <h1>Keepsake</h1>
    <p class="lead">모든 순간을 저장하기보다,<br />소중한 순간을 선택한다.</p>
    <p>수많은 사진 중 정말 간직하고 싶은 순간을 직접 고르고, 의미를 기록하고, 시간이 지난 뒤 다시 돌아볼 수 있게 돕는 개인 사진 아카이브 앱입니다.</p>
    <div><span class="soon">COMING SOON</span></div>
  </main>
  <footer>
    <a href="https://atelierlabs.co.kr/">Atelier Labs</a> · 문의: atelierlabs.kr@gmail.com
  </footer>
</body>
</html>
